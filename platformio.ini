; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_https.csv
lib_deps = tzapu/WiFiManager, bblanchon/ArduinoJson, ricmoo/QRCode, stepansnigirev/uBitcoin
extra_scripts = pre:generate_version.py

[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_https.csv
build_flags = -include esp_random.h
lib_deps = tzapu/WiFiManager, bblanchon/ArduinoJson, ricmoo/QRCode, stepansnigirev/uBitcoin
extra_scripts = pre:generate_version.py

[env:t-dongle-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_tdongle.csv
build_flags = -include esp_random.h -DESPIN_TDONGLE
lib_deps = tzapu/WiFiManager, bblanchon/ArduinoJson, ricmoo/QRCode, stepansnigirev/uBitcoin, adafruit/Adafruit GFX Library, adafruit/Adafruit ST7735 and ST7789 Library, fastled/FastLED
extra_scripts = pre:generate_version.py
